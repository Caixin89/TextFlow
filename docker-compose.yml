services:
  flowchart_vqa:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./notebook:/app/notebook
    ports:
      - "8888:8888"  
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  flowchart_vqa_cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./notebook:/app/notebook
    ports:
      - "8888:8888"
    environment:
      # disable flash-attention at runtime for CPU container
      - ENABLE_FLASH_ATTENTION=0
