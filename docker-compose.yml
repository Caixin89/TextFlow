services:
  flowchart_vqa:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  flowchart_vqa_cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    environment:
      # disable flash-attention at runtime for CPU container
      - ENABLE_FLASH_ATTENTION=0

  genflowchart:
    build:
      context: .
      dockerfile: ./GenFlowchart/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/home/zhengxin.chai/GenFlowchart/data
      - ./GenFlowchart/src:/home/zhengxin.chai/GenFlowchart/src
      - ./output:/home/zhengxin.chai/GenFlowchart/output
      - ~/.cache:/home/zhengxin.chai/.cache
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  genflowchart_cpu:
    build:
      context: .
      dockerfile: ./GenFlowchart/Dockerfile.cpu
    env_file:
      - .env
    volumes:
      - ./data:/home/zhengxin.chai/GenFlowchart/data
      - ./GenFlowchart/src:/home/zhengxin.chai/GenFlowchart/src
      - ./output:/home/zhengxin.chai/GenFlowchart/output
      - ~/.cache:/home/zhengxin.chai/.cache